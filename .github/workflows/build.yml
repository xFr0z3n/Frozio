name: Build, inject, sign and release Frozio

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct URL to the decrypted NaviMus 1.6.1 IPA (leave empty to use ipa_asset)"
        required: false
        default: ""
        type: string
      display_name:
        description: "Home-screen name of the app"
        required: true
        default: "Frozio"
        type: string
      ipa_asset:
        description: "Asset name in this repo's DRAFT release named 'ipa-source' (used when ipa_url is empty)"
        required: false
        default: "com.reillywilkinson.NaviMus-1.6.1-eeveedecrypter.ipa"
        type: string
      debug:
        description: "Debug build (FROZIO_DEBUG=1: os_log logger compiled in)"
        required: true
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  THEOS_REF: 344ee5925df036dbd1312b783ad5a00d153c2445   # same pin as FrozenMusic
  INSERT_DYLIB_REF: eb7278162af8fcc372e7f2946a2dee6a386b17d8
  BUNDLE_ID: com.reillywilkinson.NaviMus

jobs:
  build:
    name: Build and sign
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          path: main

      - name: Install dependencies
        run: brew install make ldid
      - name: Set PATH and THEOS
        run: |
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> "$GITHUB_ENV"

      - name: Cache Theos
        id: theos
        uses: actions/cache@v5.0.3
        with:
          path: theos/
          key: theos-${{ env.THEOS_REF }}
      - name: Setup Theos
        if: steps.theos.outputs.cache-hit != 'true'
        uses: actions/checkout@v6.0.2
        with:
          repository: theos/theos
          ref: ${{ env.THEOS_REF }}
          path: theos
          submodules: recursive
      - name: Link Xcode iPhoneOS SDK into Theos
        # theos/sdks stops at iOS 16.5; NaviMus needs a >= 17.0 deployment target.
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          VER="$(xcrun --sdk iphoneos --show-sdk-version)"
          mkdir -p "$THEOS/sdks"
          rm -rf "$THEOS/sdks/iPhoneOS$VER.sdk"
          ln -s "$SDK" "$THEOS/sdks/iPhoneOS$VER.sdk"
          ls -la "$THEOS/sdks"

      - name: Build insert_dylib
        run: |
          git clone --quiet https://github.com/Tyilo/insert_dylib.git "$RUNNER_TEMP/insert_dylib"
          git -C "$RUNNER_TEMP/insert_dylib" checkout --quiet "$INSERT_DYLIB_REF"
          clang -O2 -o "$RUNNER_TEMP/insert_dylib_bin" "$RUNNER_TEMP/insert_dylib/insert_dylib/main.c"
          echo "INSERT_DYLIB=$RUNNER_TEMP/insert_dylib_bin" >> "$GITHUB_ENV"

      - name: Build tweak
        working-directory: main
        run: |
          DBG=0; [ "${{ inputs.debug }}" = "true" ] && DBG=1
          make clean all FINALPACKAGE=1 FROZIO_DEBUG=$DBG
          # Exclude the dSYM: it contains a DWARF file also named Frozio.dylib (MH_DSYM, filetype 10),
          # which dyld refuses ("unloadable mach-o file type 10"); build r3 shipped that by mistake.
          DYLIB="$(find .theos/obj -name Frozio.dylib -type f -not -path '*.dSYM/*' | head -n1)"
          [ -f "$DYLIB" ] || { echo "::error::Frozio.dylib not built"; exit 1; }
          echo "== otool -hv"; otool -hv "$DYLIB"
          otool -hv "$DYLIB" | awk 'NR>3' | grep -qw DYLIB || { echo "::error::$DYLIB is not an MH_DYLIB"; exit 1; }
          cp "$DYLIB" "$RUNNER_TEMP/Frozio.dylib"
          # Theos sets the jailbreak install name (/Library/MobileSubstrate/DynamicLibraries/...);
          # a sideloaded dylib should identify as @rpath/Frozio.dylib. Re-sign ad hoc after the edit.
          install_name_tool -id "@rpath/Frozio.dylib" "$RUNNER_TEMP/Frozio.dylib"
          ldid -S "$RUNNER_TEMP/Frozio.dylib"
          echo "== otool -D (install name)"; otool -D "$RUNNER_TEMP/Frozio.dylib"
          echo "== otool -L Frozio.dylib"; otool -L "$RUNNER_TEMP/Frozio.dylib"
          echo "== lipo"; lipo -info "$RUNNER_TEMP/Frozio.dylib"
          # Line 1 = file path, line 2 = the dylib's own LC_ID_DYLIB; dependencies start at line 3.
          if otool -L "$RUNNER_TEMP/Frozio.dylib" | tail -n +3 | grep -qiE 'substrate|ellekit|libhooker'; then
            echo "::error::Frozio.dylib links a hooking runtime; Phase 1 must not."
            exit 1
          fi

      - name: Fetch IPA
        env:
          GH_TOKEN: ${{ github.token }}
          IPA_URL: ${{ inputs.ipa_url }}
          IPA_ASSET: ${{ inputs.ipa_asset }}
        run: |
          if [ -n "$IPA_URL" ]; then
            echo "::add-mask::$IPA_URL"
            curl -fsSL "$IPA_URL" -o "$RUNNER_TEMP/in.ipa"
          else
            API="$(gh api "repos/${{ github.repository }}/releases" \
              --jq ".[] | select(.name==\"ipa-source\") | .assets[] | select(.name==\"$IPA_ASSET\") | .url" | head -n1)"
            [ -n "$API" ] || { echo "::error::No asset '$IPA_ASSET' in a release named 'ipa-source'"; exit 1; }
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" "$API" -o "$RUNNER_TEMP/in.ipa"
          fi
          file "$RUNNER_TEMP/in.ipa"
          unzip -tq "$RUNNER_TEMP/in.ipa"

      - name: Unpack and check NaviMus build
        run: |
          W="$RUNNER_TEMP/ipa"; rm -rf "$W"; mkdir -p "$W"
          unzip -q "$RUNNER_TEMP/in.ipa" -d "$W"
          APP="$(ls -d "$W"/Payload/*.app | head -n1)"
          echo "APP=$APP" >> "$GITHUB_ENV"
          EXE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          echo "EXE=$EXE" >> "$GITHUB_ENV"
          VER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")"
          BLD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")"
          BID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          echo "app=$APP exe=$EXE version=$VER build=$BLD bundle=$BID"
          [ "$BID" = "$BUNDLE_ID" ] || { echo "::error::Unexpected bundle ID $BID"; exit 1; }
          [ "$VER" = "1.6.1" ] && [ "$BLD" = "173" ] || echo "::warning::NaviMus $VER ($BLD) is not the verified 1.6.1 (173); Frozio's version gate will keep it inert."
          CRYPTID="$(otool -l "$APP/$EXE" | grep -A6 LC_ENCRYPTION_INFO | awk '/cryptid/{print $2; exit}')"
          echo "cryptid=${CRYPTID:-none}"
          [ "${CRYPTID:-0}" = "0" ] || { echo "::error::IPA is encrypted (cryptid=$CRYPTID); a decrypted IPA is required"; exit 1; }
          dwarfdump --uuid "$APP/$EXE"
          codesign -d --entitlements :- "$APP" > "$RUNNER_TEMP/orig-ent.plist" 2>/dev/null || true
          [ -s "$RUNNER_TEMP/orig-ent.plist" ] || echo '<?xml version="1.0"?><plist version="1.0"><dict/></plist>' > "$RUNNER_TEMP/orig-ent.plist"
          plutil -p "$RUNNER_TEMP/orig-ent.plist"

      - name: Inject Frozio.dylib
        run: |
          mkdir -p "$APP/Frameworks"
          cp "$RUNNER_TEMP/Frozio.dylib" "$APP/Frameworks/Frozio.dylib"
          mkdir -p "$APP/Frozio.bundle"
          cp -R "main/layout/Library/Application Support/Frozio.bundle/." "$APP/Frozio.bundle/"
          # Binary already has LC_RPATH @executable_path/Frameworks (Phase 0, ipsw macho info cmd 068).
          "$INSERT_DYLIB" --inplace --all-yes "@rpath/Frozio.dylib" "$APP/$EXE"
          otool -L "$APP/$EXE" | grep Frozio

      - name: Install app icons (cyan primary, white alternate)
        run: |
          python3 main/scripts/patch_icons.py --app "$APP" \
            --primary main/Resources/AppIcons/cyan --alternate main/Resources/AppIcons/white

      - name: Expose Documents in the Files app (debug builds only)
        if: ${{ inputs.debug }}
        run: |
          # The user has no Mac/Console.app: debug logs go to Documents/Frozio/frozio.log and are
          # read from Files > On My iPhone > Frozio. Release builds keep NaviMus's Info.plist as is.
          /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" "$APP/Info.plist" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :UIFileSharingEnabled true" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" "$APP/Info.plist" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :LSSupportsOpeningDocumentsInPlace true" "$APP/Info.plist"
          plutil -p "$APP/Info.plist" | grep -E 'UIFileSharingEnabled|LSSupportsOpeningDocumentsInPlace'

      - name: Set display name
        env:
          DISPLAY_NAME: ${{ inputs.display_name }}
        run: |
          # Only the home-screen label. CFBundleName/Identifier/Executable stay untouched
          # (the version gate and NaviMus's own paths depend on them). Arpeggi ships no
          # InfoPlist.strings that could override it.
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName $DISPLAY_NAME" "$APP/Info.plist"
          if find "$APP" -name InfoPlist.strings | grep -q .; then
            echo "::warning::InfoPlist.strings present; a localized CFBundleDisplayName may override '$DISPLAY_NAME'"
          fi
          echo "CFBundleDisplayName=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist")"

      # Signing is OPTIONAL. Without the 5 secrets the IPA is left unsigned (like FrozenMusic)
      # and is meant to be signed by your own signer (Sideloadly, Feather, ESign, ...).
      - name: Check signing secrets (optional)
        id: secrets
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          missing=()
          for v in BUILD_CERTIFICATE_BASE64 P12_PASSWORD PROVISIONING_PROFILE_BASE64 TEAM_ID KEYCHAIN_PASSWORD; do
            [ -n "${!v}" ] || missing+=("$v")
          done
          if [ ${#missing[@]} -eq 0 ]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"; echo "SIGNED=signed" >> "$GITHUB_ENV"
          elif [ ${#missing[@]} -eq 5 ]; then
            echo "sign=false" >> "$GITHUB_OUTPUT"; echo "SIGNED=unsigned" >> "$GITHUB_ENV"
            echo "::notice::No signing secrets set: producing an UNSIGNED IPA for your own signer."
          else
            echo "::error::Signing secrets are partially set (missing: ${missing[*]}). Set all 5 or none."
            exit 1
          fi

      - name: Set up signing keychain and profile
        if: steps.secrets.outputs.sign == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set +x
          KC="$RUNNER_TEMP/frozio-signing.keychain-db"
          echo "KC=$KC" >> "$GITHUB_ENV"
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          printf '%s' "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC" > /dev/null
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KC" > /dev/null
          security list-keychain -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          IDENTITY="$(security find-identity -v -p codesigning "$KC" | awk 'NR==1{print $2}')"
          [ -n "$IDENTITY" ] || { echo "::error::No codesigning identity in the certificate"; exit 1; }
          echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          echo "profile: $(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist"), team $(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")"

      - name: Derive entitlements for the new team
        if: steps.secrets.outputs.sign == 'true'
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          python3 main/scripts/derive_entitlements.py --original "$RUNNER_TEMP/orig-ent.plist" \
            --profile "$RUNNER_TEMP/profile.plist" --bundle-id "$BUNDLE_ID" --out "$RUNNER_TEMP/ent.plist"
          PT="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")"
          [ "$PT" = "$TEAM_ID" ] || { echo "::error::TEAM_ID secret does not match the profile's team"; exit 1; }

      - name: Sign inside-out (dylibs/frameworks -> extensions -> app)
        if: steps.secrets.outputs.sign == 'true'
        run: |
          cp "$RUNNER_TEMP/profile.mobileprovision" "$APP/embedded.mobileprovision"
          rm -rf "$APP/_CodeSignature"
          # 1. every nested dylib / framework (deepest first)
          find "$APP" -depth \( -name '*.dylib' -o -name '*.framework' \) -not -path '*/PlugIns/*' -print0 |
            while IFS= read -r -d '' f; do
              codesign -f -s "$IDENTITY" --keychain "$KC" --generate-entitlement-der "$f"
            done
          # 2. app extensions (NaviMus 1.6.1 has none; kept for future Frozio extensions)
          if [ -d "$APP/PlugIns" ]; then
            for x in "$APP"/PlugIns/*.appex; do
              codesign -f -s "$IDENTITY" --keychain "$KC" --generate-entitlement-der "$x"
            done
          fi
          # 3. the app
          codesign -f -s "$IDENTITY" --keychain "$KC" --entitlements "$RUNNER_TEMP/ent.plist" --generate-entitlement-der "$APP"

      - name: Verify injection and icons
        run: |
          echo "== otool -L (main binary)"; otool -L "$APP/$EXE"
          otool -L "$APP/$EXE" | grep -q '@rpath/Frozio.dylib' || { echo "::error::Frozio.dylib not in load commands"; exit 1; }
          otool -l "$APP/$EXE" | grep -A2 LC_RPATH | grep -q '@executable_path/Frameworks' || { echo "::error::LC_RPATH @executable_path/Frameworks missing"; exit 1; }
          test -f "$APP/Frameworks/Frozio.dylib" && lipo -info "$APP/Frameworks/Frozio.dylib"
          echo "== otool -hv Frozio.dylib"; otool -hv "$APP/Frameworks/Frozio.dylib"
          otool -hv "$APP/Frameworks/Frozio.dylib" | awk 'NR>3' | grep -qw DYLIB || { echo "::error::injected Frozio.dylib is not an MH_DYLIB"; exit 1; }
          echo "== otool -L Frozio.dylib"; otool -L "$APP/Frameworks/Frozio.dylib"
          echo "== icons"; plutil -p "$APP/Info.plist" | sed -n '/CFBundleIcons/,/^  }/p'
          ls -la "$APP"/AppIcon* "$APP"/FrozioWhite* "$APP/Frozio.bundle"

      - name: Verify signature
        if: steps.secrets.outputs.sign == 'true'
        run: |
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "== entitlements"; codesign -d --entitlements :- "$APP" 2>/dev/null | plutil -p -
          echo "== signer"; codesign -dvv "$APP" 2>&1 | grep -E 'Authority|TeamIdentifier|Identifier='

      - name: Package IPA
        run: |
          VER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")"
          KIND=release; [ "${{ inputs.debug }}" = "true" ] && KIND=debug
          OUT="Frozio-NaviMus-$VER-r${{ github.run_number }}-$KIND-$SIGNED.ipa"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/$OUT" Payload)
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          ls -la "$GITHUB_WORKSPACE/$OUT"

      - name: Create DRAFT release (private to repo owner)
        uses: softprops/action-gh-release@v2.5.0
        with:
          name: Frozio build ${{ github.run_number }}
          tag_name: build-${{ github.run_number }}
          files: ${{ env.OUT }}
          draft: true

      - name: Remove keychain and profile
        if: always()
        run: |
          [ -n "$KC" ] && security delete-keychain "$KC" || true
          rm -f "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist" "$RUNNER_TEMP/cert.p12"
